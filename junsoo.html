<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이 준 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#fdeef3; --ink:#4a3241; --soft:#b58aa3; --accent:#8a6bc4; --accent-ink:#ffffff; --panel:rgba(253,238,243,.9);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
}
:root[data-theme="dark"]{--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background-color .8s}
.wrap{position:relative;width:100%;max-width:900px}
canvas{display:block;width:100%;height:auto;border-radius:22px;cursor:pointer;outline:none;box-shadow:0 0 0 3px var(--soft)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.screen{position:absolute;inset:0;border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;
  gap:clamp(12px,4vw,40px);padding:12px 20px;box-sizing:border-box;text-align:center}
.screen.hidden{display:none}
.hero{width:clamp(52px,12vw,110px);height:auto;transform:scaleX(-1);animation:bob 1.1s ease-in-out infinite}
.over .hero{transform:scaleX(-1) rotate(14deg);animation:none;opacity:.9}
@keyframes bob{50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.col{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vw,10px)}
.title{font-size:clamp(26px,6.5vw,56px);line-height:1}
#overBig{font-size:clamp(20px,4.6vw,40px);line-height:1.15;max-width:16em}
.sub{font-size:clamp(13px,2.2vw,18px);color:var(--soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
button{font:inherit;font-size:clamp(14px,2.2vw,18px);border:0;border-radius:999px;padding:.45em 1.1em;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--soft)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:active{transform:translateY(1px)}
.help{font-size:15px;color:var(--soft);text-align:center;line-height:1.6;max-width:60ch}
kbd{font-family:inherit;border:2px solid var(--soft);border-radius:6px;padding:0 6px;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="900" height="300" tabindex="0" aria-label="게임 화면. 스페이스로 점프, 아래 화살표로 숙이기"></canvas>
  <div class="screen" id="menu">
    <img class="hero" id="heroMenu" alt="">
    <div class="col">
      <div class="title">이 준 수</div>
      <div class="sub" id="menuBest">최고 기록 0점</div>
      <div class="btns">
        <button id="startBtn">시작하기</button>
        <button class="ghost" id="soundBtn">소리 켜짐</button>
      </div>
    </div>
  </div>
  <div class="screen over hidden" id="over">
    <img class="hero" id="heroOver" alt="">
    <div class="col">
      <div class="title" id="overBig">또 졌다…</div>
      <div class="sub" id="overSmall">0점</div>
      <div class="btns">
        <button id="retryBtn">다시 하기</button>
        <button class="ghost" id="menuBtn">메뉴로</button>
      </div>
    </div>
  </div>
</div>

/* ---------- palettes (lerped for smooth day/night) ---------- */
const PAL={
  light:{top:'#f7dbe8',bot:'#fdeef3',ground:'#6b4a5c',ink:'#4a3241',soft:'#b58aa3',cloud:'#ffffff'},
  dark: {top:'#3a2738',bot:'#2a1e2b',ground:'#e6bcd2',ink:'#f6e3ee',soft:'#a07a92',cloud:'#4a3549'}
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixC=(a,b,m)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*m)).join(',')+')';};
const sysDark=()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
let base=sysDark()?1:0, mix=base, target=base;
const col=k=>mixC(PAL.light[k],PAL.dark[k],mix);
function setPageTheme(v){ if(v===null)document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme=v?'dark':'light'; }

/* ---------- storage ---------- */
let best=0, soundOn=true;
try{best=+localStorage.getItem('pouty-best')||0; soundOn=localStorage.getItem('pouty-sound')!=='off';}catch(e){}
function syncMenu(){$('menuBest').textContent='최고 기록 '+best+'점'; $('soundBtn').textContent=soundOn?'소리 켜짐':'소리 꺼짐';}

/* ---------- sound ---------- */
let ac=null;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); return ac; }
function tone(f1,f2,dur,type,vol,delay=0){
  if(!soundOn)return; const a=audio(); if(!a)return;
  const t0=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}
const sfxJump=()=>{tone(380,880,0.13,'square',0.06);};
const sfxClick=()=>{tone(660,990,0.06,'square',0.05); tone(990,1320,0.07,'triangle',0.05,0.05);};
document.addEventListener('click',e=>{if(e.target.closest('button'))sfxClick();},true);
const sfxBoss=()=>{tone(110,55,0.7,'sawtooth',0.08);tone(220,110,0.6,'square',0.04,0.12);};
const sfxKiss=()=>{tone(900,1500,0.08,'sine',0.08);tone(1500,700,0.14,'sine',0.06,0.08);};
function showBanner(text){banner={text,life:150};}
const sfxDie=()=>{tone(520,90,0.5,'sawtooth',0.07); tone(260,60,0.55,'triangle',0.09,0.05); tone(140,70,0.3,'square',0.04,0.42);};

/* ---------- BGM (step sequencer) ---------- */
const SONGS={
  menu:{step:60/96/2,leadType:'triangle',leadVol:.05,bassType:'sine',bassVol:.09,bassMode:'half',hat:false,
    bass:[48,45,41,43],
    lead:[76,79,84,79,76,null,74,null, 72,76,81,76,72,null,71,null, 69,72,77,72,69,null,72,null, 71,74,79,77,74,null,71,null]},
  game:{step:.2,leadType:'square',leadVol:.028,bassType:'triangle',bassVol:.08,bassMode:'bounce',hat:true,
    bass:[45,41,48,43],
    lead:[69,72,76,81,79,76,72,76, 65,69,72,77,76,72,69,72, 76,null,79,76,72,null,74,76, 74,null,71,null,67,69,71,74]},
  boss:{step:.17,leadType:'sawtooth',leadVol:.022,bassType:'square',bassVol:.05,bassMode:'bounce',hat:true,
    bass:[40,41,38,39],
    lead:[64,67,71,76,75,71,67,71, 65,69,72,77,76,72,69,72, 62,65,69,74,72,69,65,62, 63,67,70,75,74,null,71,null]}
};
const music={name:null,i:0,next:0,timer:null,bus:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mnote(m,t,d,type,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(music.bus);o.start(t);o.stop(t+d+.03);}
let noiseBuf=null;
function hat(t){if(!noiseBuf){noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.05),ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(f).connect(g).connect(music.bus);s.start(t);s.stop(t+.05);}
function tick(){const S=SONGS[music.name];if(!S||!ac||!music.bus)return;
  if(music.next<ac.currentTime)music.next=ac.currentTime+.05;
  while(music.next<ac.currentTime+.15){const i=music.i%32,t=music.next,r=S.bass[Math.floor(i/8)];
    let sd=S.step; if(music.name!=='menu'&&state==='playing')sd*=Math.max(.72,1-(speed-6.2)*.035);
    const n=S.lead[i]; if(n!=null)mnote(n,t,sd*1.6,S.leadType,S.leadVol);
    if(S.bassMode==='half'){if(i%4===0)mnote(r,t,sd*3.5,S.bassType,S.bassVol);} else mnote(i%2?r+12:r,t,sd*.9,S.bassType,S.bassVol);
    if(S.hat&&i%2===1)hat(t);
    music.i++; music.next+=sd;}}
function stopBgm(){if(music.timer){clearInterval(music.timer);music.timer=null;}
  if(music.bus&&ac){const b=music.bus;b.gain.setTargetAtTime(0.0001,ac.currentTime,.08);setTimeout(()=>{try{b.disconnect();}catch(e){}},700);}
  music.bus=null;music.name=null;}
function playBgm(name){if(music.name===name&&music.timer)return;stopBgm();if(!soundOn)return;const a=audio();if(!a)return;
  music.name=name;music.i=0;music.next=a.currentTime+.08;music.bus=a.createGain();music.bus.gain.value=1;music.bus.connect(a.destination);
  music.timer=setInterval(tick,25);tick();}
const firstGesture=()=>{if(state==='menu')playBgm('menu');removeEventListener('pointerdown',firstGesture);removeEventListener('keydown',firstGesture);};
addEventListener('pointerdown',firstGesture);addEventListener('keydown',firstGesture);

/* ---------- game state ---------- */
const P={x:70,w:72,h:70,y:0,vy:0,duck:false,onGround:true};
let state='menu', speed, score, obs, clouds, stars, dust, nextSpawn, t=0, shake=0, lastMilestone, overAt=0, boss, kisses, banner;

function fitWidth(){ const nw=cv.parentElement.clientWidth<600?560:900; if(nw!==W){W=nw;cv.width=W;} }
function reset(){
  fitWidth();
  speed=6.2; score=0; obs=[]; dust=[]; nextSpawn=60; shake=0; lastMilestone=0;
  P.y=GROUND-P.h; P.vy=0; P.duck=false; P.onGround=true; P.x=70;
  boss={active:false,done:false,phase:'',x:-220,cd:0,charge:0,kissHigh:false}; kisses=[]; banner=null;
  base=sysDark()?1:0; target=base; mix=base;
  clouds=Array.from({length:4},(_,i)=>({x:i*260+Math.random()*120,y:30+Math.random()*70,s:.6+Math.random()*.6}));
  stars=Array.from({length:30},()=>({x:Math.random()*900,y:Math.random()*170,r:Math.random()*1.4+.6,p:Math.random()*6}));
}
reset();

function start(){ audio(); reset(); state='playing'; playBgm('game'); menu.classList.add('hidden'); over.classList.add('hidden'); setPageTheme(null); cv.focus(); }
function toMenu(){ state='menu'; reset(); playBgm('menu'); setPageTheme(null); over.classList.add('hidden'); menu.classList.remove('hidden'); syncMenu(); $('startBtn').focus(); }
function jump(){
  if(state!=='playing')return;
  if(P.onGround){P.vy=-15.2;P.onGround=false;puff(6);sfxJump();}
}
function puff(n){for(let i=0;i<n;i++)dust.push({x:P.x+20+Math.random()*24,y:GROUND-4,vx:-1-Math.random()*2,vy:-Math.random()*1.5,life:22});}

$('startBtn').onclick=start; $('retryBtn').onclick=start; $('menuBtn').onclick=toMenu;
$('soundBtn').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('pouty-sound',soundOn?'on':'off');}catch(e){} syncMenu(); if(soundOn)playBgm(state==='playing'?'game':'menu'); else stopBgm();};

addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='Escape'&&state!=='menu'){toMenu();return;}
  if(['Space','ArrowUp','KeyW'].includes(k)){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&state!=='playing')return;
    e.preventDefault();
    if(state==='playing')jump();
    else if(state==='menu')start();
    else if(state==='over'&&performance.now()-overAt>450)start();
  }
  if(['ArrowDown','KeyS'].includes(k)&&state==='playing'){e.preventDefault();P.duck=true;if(!P.onGround)P.vy+=4;}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))P.duck=false;});
let ty=null,duckTimer=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();ty=e.touches[0].clientY;},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(ty!==null&&e.touches[0].clientY-ty>25&&state==='playing'){P.duck=true;if(!P.onGround)P.vy+=4;ty=null;clearTimeout(duckTimer);duckTimer=setTimeout(()=>P.duck=false,550);}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(ty!==null)jump();ty=null;},{passive:false});
cv.addEventListener('mousedown',jump);
addEventListener('resize',()=>{if(state!=='playing')fitWidth();});

function spawn(){
  const r=Math.random();
  if(score>250&&r<.25){const high=Math.random()<.5;obs.push({type:'bug',x:W+20,y:high?GROUND-118:GROUND-72,w:44,h:26});}
  else if(r<.62){const n=1+Math.floor(Math.random()*Math.min(3,1+score/300));obs.push({type:'broc',x:W+20,n,w:34*n+6,h:46,y:GROUND-46});}
  else obs.push({type:'carrot',x:W+20,w:30,h:66,y:GROUND-66});
  nextSpawn=(Math.max(42,95-speed*3)+Math.random()*60)*(boss.active&&boss.phase!=='out'?1.5:1);
}
const hit=(a,o)=>a.x<o.x+o.w&&a.x+a.w>o.x&&a.y<o.y+o.h&&a.y+a.h>o.y;

function update(){
  t++;
  if(banner&&--banner.life<=0)banner=null;
  mix+=(target-mix)*0.04; if(Math.abs(target-mix)<.002)mix=target;
  const cs=state==='playing'?speed:2.5;
  for(const c of clouds){c.x-=cs*.15*c.s;if(c.x<-140){c.x=W+Math.random()*100;c.y=30+Math.random()*70;}}
  for(const s of stars){s.x-=cs*.04;if(s.x<0)s.x+=W;}
  for(const d of dust){d.x+=d.vx-speed*.3;d.y+=d.vy;d.life--;}
  dust=dust.filter(d=>d.life>0);
  if(state!=='playing')return;
  speed=Math.min(15,speed+0.0026);
  score+=speed*0.025;
  const m=Math.floor(score/100); if(m>lastMilestone){lastMilestone=m;shake=6;}
  const flip=Math.floor(score/500)%2, nt=base^flip;
  if(nt!==target){target=nt;setPageTheme(target);}
  P.vy+=P.duck&&!P.onGround?1.3:0.78; P.y+=P.vy;
  if(P.y+P.h>=GROUND){if(!P.onGround)puff(5);P.y=GROUND-P.h;P.vy=0;P.onGround=true;}
  if(P.onGround&&t%8===0)dust.push({x:P.x+20,y:GROUND-3,vx:-1,vy:-.4,life:14});
  /* boss: 1000~2000 */
  if(!boss.active&&!boss.done&&score>=1000){boss.active=true;boss.phase='in';boss.x=-180;boss.cd=120;boss.charge=0;showBanner('보스 등장!');shake=10;playBgm('boss');sfxBoss();}
  if(boss.active){
    if(boss.phase==='in'){boss.x+=(30-boss.x)*.04;if(boss.x>24)boss.phase='chase';}
    else if(boss.phase==='chase'){
      boss.x=30+Math.sin(t*.03)*14;
      if(boss.charge>0){ if(--boss.charge===0){kisses.push({x:boss.x+bossW()-6,y:boss.kissHigh?GROUND-74:GROUND-30,w:28,h:24});sfxKiss();
          boss.cd=Math.max(50,105-(score-1000)*.04)+Math.random()*60;} }
      else if(--boss.cd<=0){boss.charge=42;boss.kissHigh=Math.random()<.4;}
      if(score>=2000){boss.phase='out';boss.charge=0;showBanner('보스를 따돌렸다!');playBgm('game');}
    } else {boss.x-=4;if(boss.x<-240){boss.active=false;boss.done=true;}}
  }
  P.x+=((boss.active&&boss.phase!=='out'?190:70)-P.x)*.05;
  for(const k of kisses)k.x+=3+speed*.15;
  kisses=kisses.filter(k=>k.x<W+40);
  if(--nextSpawn<=0)spawn();
  for(const o of obs)o.x-=speed*(o.type==='bug'?1.12:1);
  obs=obs.filter(o=>o.x>-80);
  const h=P.duck&&P.onGround?P.h*.62:P.h, top=P.onGround?GROUND-h:P.y;
  const box={x:P.x+13,y:top+10,w:P.w-26,h:h-15};
  for(const o of obs){if(hit(box,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-6})){die(o.type);break;}}
  if(state==='playing')for(const k of kisses){if(hit(box,{x:k.x+3,y:k.y+3,w:k.w-6,h:k.h-6})){die('kiss');break;}}
}
const LINES={
  any:['또 졌다…','아 진짜 안 해','이건 랙이야','방금 건 무효지?','하… 한 판만 더','손이 미끄러졌어','기분 나빠졌어','오늘은 운이 없네','억울하다…','진짜 마지막 판이야','다리가 짧아서 그래','흥, 일부러 져준 거야'],
  broc:['브로콜리는 진짜 싫어','초록색 나무한테 졌다','브로콜리 때문에 기분 망침','채소는 역시 적이야'],
  carrot:['당근은 반칙이야','당근한테 졌다니 당근히 분하다','당근 맛없어…','눈이 좋아질 뻔했네'],
  bug:['모기 진짜 짜증나','어디서 윙윙거려…','모기한테 물렸다','벌레는 반칙이지'],
  kiss:['뽀뽀는 피했어야 했는데','으악 맞아버렸다','보스 뽀뽀에 쓰러짐…','그 입술은 반칙이야','다시는 안 당해'],
  best:['신기록… 근데 기분은 별로','신기록인데 왜 안 기쁘지','최고 기록 갱신… 흥','기록은 깨졌는데 내 마음도 깨졌어']
};
let lastLine='';
function pickLine(cause,isBest){
  let pool=isBest?LINES.best:(LINES[cause]&&Math.random()<(cause==='kiss'?.75:.5)?LINES[cause]:LINES.any);
  pool=pool.filter(l=>l!==lastLine)||pool; lastLine=pool[Math.floor(Math.random()*pool.length)]; return lastLine;
}
function die(cause){
  state='over'; shake=14; overAt=performance.now(); stopBgm(); sfxDie();
  const s=Math.floor(score), isBest=s>best;
  if(isBest){best=s;try{localStorage.setItem('pouty-best',best);}catch(e){}}
  $('overBig').textContent=pickLine(cause,isBest);
  $('overSmall').textContent=s+'점 · 최고 '+best+'점';
  setTimeout(()=>{if(state==='over'){over.classList.remove('hidden');$('retryBtn').focus({preventScroll:true});}},550);
}

/* ---------- drawing ---------- */
function drawCloud(c){ctx.fillStyle=col('cloud');ctx.globalAlpha=.85;ctx.beginPath();const s=c.s;
  ctx.arc(c.x,c.y,18*s,0,7);ctx.arc(c.x+22*s,c.y-10*s,22*s,0,7);ctx.arc(c.x+48*s,c.y,17*s,0,7);ctx.rect(c.x,c.y,48*s,16*s);ctx.fill();ctx.globalAlpha=1;}
function drawBroc(o){for(let i=0;i<o.n;i++){const x=o.x+3+i*34;
  ctx.fillStyle='#8fbf5a';ctx.fillRect(x+12,o.y+22,10,24);
  ctx.fillStyle='#4f9a3a';ctx.beginPath();ctx.arc(x+8,o.y+18,10,0,7);ctx.arc(x+26,o.y+18,10,0,7);ctx.arc(x+17,o.y+9,11,0,7);ctx.fill();
  ctx.fillStyle='#3b7a2c';ctx.beginPath();ctx.arc(x+12,o.y+12,3,0,7);ctx.arc(x+23,o.y+20,3,0,7);ctx.fill();}}
function drawCarrot(o){
  ctx.fillStyle='#5aa83f';ctx.beginPath();ctx.ellipse(o.x+10,o.y+8,4,11,-.4,0,7);ctx.ellipse(o.x+20,o.y+8,4,11,.4,0,7);ctx.ellipse(o.x+15,o.y+5,4,12,0,0,7);ctx.fill();
  ctx.fillStyle='#f08a3c';ctx.beginPath();ctx.moveTo(o.x+2,o.y+18);ctx.quadraticCurveTo(o.x+15,o.y+12,o.x+28,o.y+18);ctx.lineTo(o.x+15,o.y+o.h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c8682a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x+8,o.y+30);ctx.lineTo(o.x+14,o.y+30);ctx.moveTo(o.x+16,o.y+42);ctx.lineTo(o.x+21,o.y+42);ctx.stroke();}
function drawBug(o){const f=Math.sin(t*.9)*6;
  ctx.fillStyle='rgba(200,220,255,.75)';ctx.beginPath();ctx.ellipse(o.x+20,o.y+6-f*.3,10,6+f*.4,-.5,0,7);ctx.ellipse(o.x+30,o.y+6-f*.3,10,6+f*.4,.5,0,7);ctx.fill();
  ctx.fillStyle=mix>.5?'#cdb8c6':'#5b4a52';ctx.beginPath();ctx.ellipse(o.x+24,o.y+16,14,7,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(o.x+8,o.y+14,6,0,7);ctx.fill();
  ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x+3,o.y+15);ctx.lineTo(o.x-8,o.y+19);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x+6,o.y+12,2,0,7);ctx.fill();}
function bossW(){return bossImg.width?150*bossImg.width/bossImg.height:115;}
function heart(x,y,s,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ff5c8a';ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
  ctx.moveTo(0,-4);ctx.bezierCurveTo(0,-10,-10,-12,-10,-4);ctx.bezierCurveTo(-10,2,-2,6,0,10);ctx.bezierCurveTo(2,6,10,2,10,-4);ctx.bezierCurveTo(10,-12,0,-10,0,-4);ctx.fill();ctx.restore();}
function drawKiss(k){const cy=k.y+k.h/2;heart(k.x-22,cy,.5,.3);heart(k.x-6,cy,.7,.55);heart(k.x+14,cy+Math.sin(t*.4)*2,1.25,1);}
function drawBoss(){
  if(!boss.active)return;
  const bh=150,bw=bossW(),hov=Math.sin(t*.08)*6;
  const sc=boss.charge>0?1.03+Math.sin(boss.charge*.7)*.03:1;
  const cx=boss.x+bw/2,by=GROUND-10+hov;
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(cx,GROUND-1,bw*.4,6,0,0,7);ctx.fill();
  ctx.save();ctx.translate(cx,by);ctx.scale(sc,sc);ctx.rotate(Math.sin(t*.05)*.05);
  if(bossImg.complete)ctx.drawImage(bossImg,-bw/2,-bh,bw,bh);
  ctx.restore();
  if(boss.charge>0){const p=(42-boss.charge)/42;
    heart(boss.x+bw+8,boss.kissHigh?GROUND-62:GROUND-18,.4+p*.9,.35+p*.5);
    ctx.fillStyle='#ff5c8a';ctx.font='34px Jua, sans-serif';ctx.textAlign='center';ctx.fillText('!',cx+bw*.3,by-bh-4+Math.sin(t*.5)*3);}
}
function drawPlayer(){
  const ducking=P.duck&&P.onGround, playing=state==='playing';
  const bob=P.onGround&&playing?Math.abs(Math.sin(t*.35))*-4:0;
  let w=P.w,h=P.h; if(ducking){w=P.w*1.18;h=P.h*.62;} else if(!P.onGround){w=P.w*.94;h=P.h*1.06;}
  const x=P.x+(P.w-w)/2, y=P.y+(P.h-h)+bob;
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(P.x+P.w/2,GROUND-1,w*.38*(P.onGround?1:.7),5,0,0,7);ctx.fill();
  ctx.save();
  const tilt=state==='over'?.25:(P.onGround?Math.sin(t*.35)*.04:.1);
  ctx.translate(x+w/2,y+h); ctx.rotate(tilt); ctx.scale(-1,1);
  if(img.complete)ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col('top')); g.addColorStop(1,col('bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0;}
  if(mix>.02){ctx.fillStyle='#fff3fa';for(const s of stars){ctx.globalAlpha=mix*(.5+.5*Math.sin(t*.05+s.p));ctx.beginPath();ctx.arc(s.x%W,s.y,s.r,0,7);ctx.fill();}
    ctx.globalAlpha=mix;ctx.fillStyle='#fff3d6';ctx.beginPath();ctx.arc(W-150,60,20,0,7);ctx.fill();
    ctx.fillStyle=col('top');ctx.beginPath();ctx.arc(W-141,54,18,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(mix<.98){ctx.globalAlpha=1-mix;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(W-150,62,22,0,7);ctx.fill();ctx.globalAlpha=1;}
  clouds.forEach(drawCloud);
  ctx.strokeStyle=col('ground');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,GROUND);ctx.lineTo(W+20,GROUND);ctx.stroke();
  ctx.fillStyle=col('soft');const off=(t*(state==='playing'?speed:2.5))%60;
  for(let i=0;i<Math.ceil(W/60)+2;i++)ctx.fillRect(i*60-off+((i*37)%23),GROUND+10+((i*13)%18),(i%3)+4,2);
  for(const o of obs){if(o.type==='broc')drawBroc(o);else if(o.type==='carrot')drawCarrot(o);else drawBug(o);}
  ctx.fillStyle=col('soft');for(const d of dust){ctx.globalAlpha=d.life/22;ctx.beginPath();ctx.arc(d.x,d.y,3,0,7);ctx.fill();}ctx.globalAlpha=1;
  if(state!=='menu'){drawBoss();for(const k of kisses)drawKiss(k);drawPlayer();}
  ctx.restore();
  if(state!=='menu'){
    ctx.textAlign='right';ctx.fillStyle=col('ink');ctx.font='22px Jua, sans-serif';
    ctx.fillText(String(Math.floor(score)).padStart(5,'0'),W-24,38);
    ctx.fillStyle=col('soft');ctx.font='16px Jua, sans-serif';ctx.fillText('최고 '+String(best).padStart(5,'0'),W-24,62);
    if(banner){ctx.globalAlpha=Math.min(1,banner.life/30);ctx.textAlign='center';ctx.font='38px Jua, sans-serif';
      ctx.lineWidth=6;ctx.strokeStyle=col('top');ctx.strokeText(banner.text,W/2,120);ctx.fillStyle='#ff5c8a';ctx.fillText(banner.text,W/2,120);ctx.globalAlpha=1;}
  }
}
let last=0,acc=0;
function loop(ts){ if(!last)last=ts; acc+=Math.min(100,ts-last); last=ts;
  while(acc>=1000/60){update();acc-=1000/60;} draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
$('startBtn').focus({preventScroll:true});
})();
</script>
