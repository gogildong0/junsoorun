<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이 준 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#fdeef3; --ink:#4a3241; --soft:#b58aa3; --accent:#8a6bc4; --accent-ink:#ffffff; --panel:rgba(253,238,243,.9);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
}
:root[data-theme="dark"]{--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
html{height:100%}
body{min-height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background-color .8s}
.wrap{position:relative;width:100%;max-width:900px}
canvas{display:block;width:100%;height:auto;border-radius:22px;cursor:pointer;outline:none;box-shadow:0 0 0 3px var(--soft)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.screen{position:absolute;inset:0;border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;
  gap:clamp(12px,4vw,40px);padding:12px 20px;box-sizing:border-box;text-align:center}
.screen.hidden{display:none}
.hero{width:clamp(52px,12vw,110px);height:auto;transform:scaleX(-1);animation:bob 1.1s ease-in-out infinite}
.over .hero{transform:scaleX(-1) rotate(14deg);animation:none;opacity:.9}
@keyframes bob{50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.col{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vw,10px)}
.title{font-size:clamp(26px,6.5vw,56px);line-height:1;cursor:default;-webkit-tap-highlight-color:transparent}
#overBig{font-size:clamp(20px,4.6vw,40px);line-height:1.15;max-width:16em}
.sub{font-size:clamp(13px,2.2vw,18px);color:var(--soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
button{font:inherit;font-size:clamp(14px,2.2vw,18px);border:0;border-radius:999px;padding:.45em 1.1em;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.btns.hidden{display:none}
.nick-title{font-size:clamp(20px,4.6vw,40px)}
.nick-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.nick-row input{width:clamp(130px,30vw,240px);font:inherit;font-size:clamp(15px,2.2vw,18px);padding:.4em .9em;border-radius:999px;border:2px solid var(--soft);background:transparent;color:var(--ink);-webkit-user-select:text;user-select:text;text-align:center}
.nick-row input:focus{outline:none;border-color:var(--accent)}
.nick-row button.hidden{display:none}
#nickMsg{min-height:1.2em;color:#d0567f}
.test button{font-size:clamp(12px,1.8vw,15px);padding:.35em .9em}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--soft)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:active{transform:translateY(1px)}
.help{font-size:15px;color:var(--soft);text-align:center;line-height:1.6;max-width:60ch}
kbd{font-family:inherit;border:2px solid var(--soft);border-radius:6px;padding:0 6px;color:var(--ink)}
.lb{width:100%;max-width:520px;box-sizing:border-box;border-radius:18px;box-shadow:inset 0 0 0 3px var(--soft);padding:14px 18px}
.lb-head{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}
button.lb-small{font-size:14px;padding:.25em .8em}
.lb-submit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:10px;border-radius:12px;background:var(--panel)}
.lb-submit.hidden{display:none}
.lb-submit input{flex:1;min-width:120px;font:inherit;font-size:16px;padding:.35em .7em;border-radius:999px;border:2px solid var(--soft);background:transparent;color:var(--ink);-webkit-user-select:text;user-select:text}
.lb-submit input:focus{outline:none;border-color:var(--accent)}
.lb-list{list-style:none;margin:0;padding:0}
.lb-list li{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:1px dashed color-mix(in srgb,var(--soft) 45%,transparent);font-size:17px}
.lb-list li:last-child{border-bottom:0}
.lb-list .rk{width:2.2em;color:var(--soft)}
.lb-list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-list .sc{font-variant-numeric:tabular-nums}
.lb-list li.muted{color:var(--soft);justify-content:center}
.lb-msg{font-size:14px;color:var(--soft);text-align:center;min-height:1.2em;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="900" height="300" tabindex="0" aria-label="게임 화면. 스페이스로 점프, 아래 화살표로 숙이기"></canvas>
  <div class="screen" id="menu">
    <img class="hero" id="heroMenu" alt="">
    <div class="col">
      <div class="title">이 준 수</div>
      <div class="sub" id="menuBest">최고 기록 0점</div>
      <div class="btns">
        <button id="startBtn">시작하기</button>
        <button class="ghost" id="nickBtn">✎ 닉네임</button>
        <button class="ghost" id="soundBtn">소리 켜짐</button>
      </div>
      <div class="btns test hidden" id="testBtns">
        <button class="ghost" data-from="1000">고석영부터</button>
        <button class="ghost" data-from="1980">피하기 직전</button>
        <button class="ghost" data-from="2470">피하기 끝</button>
        <button class="ghost" data-from="4480">드래곤 직전</button>
        <button class="ghost" data-from="3000">각성 고석영부터</button>
        <button class="ghost" id="godBtn">무적 꺼짐</button>
      </div>
    </div>
  </div>
  <div class="screen hidden" id="nick">
    <img class="hero" id="heroNick" alt="">
    <div class="col">
      <div class="title nick-title">닉네임을 정해 주세요</div>
      <div class="sub">랭킹에 이 이름으로 기록돼요</div>
      <div class="nick-row">
        <input id="nickInput" maxlength="10" placeholder="닉네임 (10자까지)" autocomplete="off" aria-label="닉네임">
        <button id="nickOk">확인</button>
        <button class="ghost hidden" id="nickCancel">취소</button>
      </div>
      <div class="sub" id="nickMsg"></div>
    </div>
  </div>
  <div class="screen over hidden" id="over">
    <img class="hero" id="heroOver" alt="">
    <div class="col">
      <div class="title" id="overBig">또 졌다…</div>
      <div class="sub" id="overSmall">0점</div>
      <div class="btns">
        <button id="retryBtn">다시 하기</button>
        <button class="ghost" id="menuBtn">메뉴로</button>
      </div>
    </div>
  </div>
</div>
<div class="help"><kbd>스페이스</kbd> / <kbd>↑</kbd> 점프 · <kbd>S</kbd> / <kbd>↓</kbd> 숙이기 · <kbd>A</kbd> / <kbd>←</kbd> 왼쪽으로 이동 · <kbd>D</kbd> / <kbd>→</kbd> 오른쪽으로 이동<br>모바일: 탭하면 점프, 아래로 쓸면 숙이기, 화면 왼쪽·오른쪽 누르기로 이동</div>
<section class="lb" aria-label="온라인 랭킹">
  <div class="lb-head"><span>🏆 랭킹 TOP 10</span><button class="ghost lb-small" id="lbRefresh">새로고침</button></div>
  <div class="lb-submit hidden" id="lbSubmit">
    <span id="lbScoreTxt"></span>
    <input id="lbName" maxlength="10" placeholder="이름 (10자까지)" autocomplete="off">
    <button id="lbSend">랭킹 등록</button>
  </div>
  <ol class="lb-list" id="lbList"><li class="muted">불러오는 중…</li></ol>
  <div class="lb-msg" id="lbMsg"></div>
</section>

let ac=null;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); return ac; }
function tone(f1,f2,dur,type,vol,delay=0){
  if(!soundOn)return; const a=audio(); if(!a)return;
  const t0=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}

function sweep(f1,f2,dur,type,v0,v1,delay=0,lfo=0){
  if(!soundOn)return; const a=audio(); if(!a)return; const t0=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(v0,t0); g.gain.exponentialRampToValueAtTime(v1,t0+dur*.94); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  let src=o;
  if(lfo){const l=a.createOscillator(),lg=a.createGain(),tg=a.createGain(); l.frequency.setValueAtTime(lfo,t0); l.frequency.linearRampToValueAtTime(lfo*2.2,t0+dur);
    lg.gain.value=.5; tg.gain.value=.5; l.connect(lg).connect(tg.gain); o.connect(tg); src=tg; l.start(t0); l.stop(t0+dur+.05);}
  src.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05);
}
function noiseBurst(dur,vol,freq){
  if(!soundOn)return; const a=audio(); if(!a)return; const t0=a.currentTime;
  const buf=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(); s.buffer=buf; f.type='bandpass';
  f.frequency.setValueAtTime(freq*3,t0); f.frequency.exponentialRampToValueAtTime(freq*.4,t0+dur); f.Q.value=.8;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t0); s.stop(t0+dur);
}

  ctx.shadowColor='#ff0020';ctx.shadowBlur=22;ctx.fillStyle='#ff2a3a';ctx.fillText(txt,W/2-w2/2,H/2-6);
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,190,190,.35)';ctx.fillText(txt,W/2-w2/2,H/2-6);ctx.restore();
}
function drawBurst(bt){
  const cx=W/2,cy=H/2-22;
  ctx.fillStyle='#12061a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.lineCap='round';
  for(let i=0;i<80;i++){const a=i*2.399+bt*.003,sp=(bt*10+i*53)%(W*.7),r0=40+sp,r1=r0+30+(i%5)*14;
    ctx.strokeStyle=i%3?'rgba(110,150,255,.32)':'rgba(205,110,255,.42)';ctx.lineWidth=1+(i%3);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.55);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.55);ctx.stroke();}
  for(let k=0;k<3;k++){ctx.strokeStyle='rgba(150,60,230,'+(.18+k*.06)+')';ctx.lineWidth=10-k*3;ctx.beginPath();
    ctx.ellipse(cx,cy+40,W*.3+k*40,40+k*10,0,bt*.03+k*2,bt*.03+k*2+2.2);ctx.stroke();}
  ctx.restore();
  const p=Math.min(1,bt/40),e=1-Math.pow(1-p,3),size=(70+e*190)*(1+bt*.0007);
  if(artImg.complete)ctx.drawImage(artImg,cx-size/2,cy-size/2,size,size);
  const vg=ctx.createRadialGradient(cx,cy,size*.2,cx,cy,size*.5);vg.addColorStop(0,'rgba(18,6,26,0)');vg.addColorStop(1,'rgba(18,6,26,1)');
  ctx.fillStyle=vg;ctx.fillRect(cx-size/2-2,cy-size/2-2,size+4,size+4);
  if(bt>=120&&bt<165&&bt%3===0||bt>=120&&bt<165&&cs.bolts){ if(bt%3===0){cs.bolts=[];for(let b=0;b<4;b++){const a0=Math.random()*6.28,pts=[];let r=size*.15;
      for(let j=0;j<7;j++){r+=size*.06;const a=a0+(Math.random()-.5)*.5;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8]);}cs.bolts.push(pts);}}
    ctx.save();ctx.strokeStyle='#e8fbff';ctx.lineWidth=2.2;ctx.shadowColor='#7fe6ff';ctx.shadowBlur=14;
    for(const pts of cs.bolts){ctx.beginPath();pts.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();}ctx.restore();}
  if(bt>=165)cs.bolts=null;
  if(bt>=40){const q=Math.min(1,(bt-40)/15),by=H-56+(1-q)*70;
    const bg=ctx.createLinearGradient(0,by,0,by+46);bg.addColorStop(0,'rgba(20,30,70,.92)');bg.addColorStop(1,'rgba(8,10,30,.95)');
    ctx.fillStyle=bg;ctx.fillRect(W*.14,by,W*.72,46);ctx.fillStyle='#d9b45a';ctx.fillRect(W*.14,by,W*.72,2);ctx.fillRect(W*.14,by+44,W*.72,2);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='20px Jua, sans-serif';ctx.fillText('스카레드 슈퍼노바 드래곤',cx,by+16);
    ctx.fillStyle='#bcd2ff';ctx.font='13px Jua, sans-serif';ctx.fillText('ATK 4000  DEF 3000',cx,by+35);
    for(let i=0;i<12;i++){const sx=cx+(i-5.5)*15,sy=by-11,lit=bt>=60+i*5;ctx.beginPath();ctx.arc(sx,sy,5,0,7);
      ctx.fillStyle=lit?'#ffcf3a':'rgba(255,255,255,.25)';if(lit){ctx.shadowColor='#ffb000';ctx.shadowBlur=10;}ctx.fill();ctx.shadowBlur=0;}
    ctx.textBaseline='alphabetic';}
  if(bt<12){ctx.fillStyle='rgba(255,255,255,'+(1-bt/12)+')';ctx.fillRect(0,0,W,H);}
}
function drawCutscene(){
  const c=cs.t,T=CS_T;
  ctx.save();
  if(c<T.burst){ctx.fillStyle='rgba(8,0,6,'+(c<40?c/40*.92:.92)+')';ctx.fillRect(0,0,W,H);}
  T.L.forEach((l,i)=>{if(c>=l.start&&c<l.start+l.dur)csLine(l,c-l.start,i);});
  if(c>=T.card&&c<T.burst){const p=Math.min(1,(c-T.card)/150),e=1-Math.pow(1-p,3),ch=20+e*(H-56),cw=ch*(cardImg.width?cardImg.width/cardImg.height:.68);
    const cx=W/2,cy=H/2+Math.sin(c*.05)*3,gr=ctx.createRadialGradient(cx,cy,ch*.2,cx,cy,ch*.85);
    gr.addColorStop(0,'rgba(255,80,40,'+(.35+.15*Math.sin(c*.15))+')');gr.addColorStop(1,'rgba(255,40,40,0)');ctx.fillStyle=gr;ctx.fillRect(cx-ch,cy-ch,ch*2,ch*2);
    if(cardImg.complete)ctx.drawImage(cardImg,cx-cw/2,cy-ch/2,cw,ch);}
  if(c>=T.flash&&c<T.burst){const p=(c-T.flash)/30,cx=W/2,cy=H/2;
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<24;i++){const a=i/24*6.283+c*.02;ctx.strokeStyle='rgba(255,255,255,'+(.15+p*.35)+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*W,cy+Math.sin(a)*W);ctx.stroke();}
    for(let i=0;i<30;i++){const x=cx+(Math.random()-.5)*W*.6,y=cy+(Math.random()-.5)*H*.9,r=1+Math.random()*3;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x,y-r*3);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*3);ctx.lineTo(x-r,y);ctx.fill();}
    ctx.restore();ctx.fillStyle='rgba(255,255,255,'+(p*p*.9)+')';ctx.fillRect(0,0,W,H);}
  if(c>=T.burst&&c<T.fade)drawBurst(c-T.burst);
  if(c>=T.fade){const p=(c-T.fade)/45;ctx.fillStyle='rgba(18,6,26,'+(.92*(1-p))+')';ctx.fillRect(0,0,W,H);
    if(p<.25){ctx.fillStyle='rgba(255,255,255,'+(1-p*4)*.8+')';ctx.fillRect(0,0,W,H);}}
  if(c<T.fade){ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='13px Jua, sans-serif';ctx.textAlign='right';ctx.fillText('스페이스 / 탭: 건너뛰기',W-14,H-10);}
  ctx.restore();
}
/* ---------- dragon boss ---------- */
function dgGeom(){const dh=250,dw=dh*(dragonImg.width?dragonImg.width/dragonImg.height:.86);const e=dg.rise<1?1-Math.pow(1-dg.rise,3):1;
  const hov=dg.phase==='fight'?Math.sin(t*.05)*4:0;return {x:dg.x-dw/2,y:GROUND-dh+(1-e)*(dh+10)+hov,dw,dh};}
/* 브레스 반폭: 양쪽 화면 끝에 항상 플레이어 한 명(72px)+여유 12px가 들어갈 공간을 남김 */
function dgHW(){const gap=P.w+12;return Math.max(20,Math.min(W*.26,dg.x-gap,W-gap-dg.x));}
function dgMouth(){const g=dgGeom();return {x:g.x+g.dw*.5,y:g.y+g.dh*.1};}
function drawDragon(){
  if(!dg.active)return;const g=dgGeom();
  ctx.save();ctx.beginPath();ctx.rect(-20,-20,W+40,GROUND+20);ctx.clip();
  const au=ctx.createRadialGradient(dg.x,g.y+g.dh*.5,10,dg.x,g.y+g.dh*.5,g.dh*.7);au.addColorStop(0,'rgba(255,90,30,.28)');au.addColorStop(1,'rgba(255,60,30,0)');
  ctx.fillStyle=au;ctx.fillRect(dg.x-g.dh,g.y-20,g.dh*2,g.dh+40);
  if(dragonImg.complete)ctx.drawImage(dragonImg,g.x,g.y,g.dw,g.dh);
  if(dg.charge>0||dg.breath>0){const m=dgMouth(),p=dg.breath>0?1:(dg.cmax-dg.charge)/dg.cmax,r=6+p*16+(dg.breath>0?Math.random()*6:0);
    const gr=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,r*2);gr.addColorStop(0,'rgba(255,255,220,.95)');gr.addColorStop(.4,'rgba(255,150,30,.8)');gr.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(m.x,m.y,r*2,0,7);ctx.fill();}
  ctx.restore();
  if(dg.charge>0){ctx.fillStyle='#ff6a1a';ctx.font='34px Jua, sans-serif';ctx.textAlign='center';ctx.fillText('!',dg.x+g.dw*.32,Math.max(30,g.y+10)+Math.sin(t*.5)*3);}
}
function drawBreath(){
  if(!dg.active)return;const hw=dgHW(),x0=dg.x-hw,x1=dg.x+hw;
  if(dg.charge>0){const p=(dg.cmax-dg.charge)/dg.cmax,a=.12+.28*p+(Math.floor(t/5)%2?.08:0);
    const zg=ctx.createLinearGradient(0,GROUND-80,0,GROUND);zg.addColorStop(0,'rgba(255,80,0,0)');zg.addColorStop(1,'rgba(255,60,0,'+a+')');
    ctx.fillStyle=zg;ctx.fillRect(x0,GROUND-80,x1-x0,80);
    ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,70,0,'+(.4+p*.5)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,GROUND-80);ctx.lineTo(x0,GROUND);ctx.moveTo(x1,GROUND-80);ctx.lineTo(x1,GROUND);ctx.stroke();ctx.restore();
    ctx.fillStyle='rgba(255,90,20,'+(.5+p*.5)+')';ctx.font='22px Jua, sans-serif';ctx.textAlign='center';
    const off=((t*1.5)%24)*dg.bdir;ctx.fillText(dg.bdir>0?'▶ ▶ ▶':'◀ ◀ ◀',dg.x+off,GROUND-16);}
  if(dg.breath>0){const m=dgMouth(),a=Math.min(1,(70-dg.breath)/5,dg.breath/8);
    ctx.save();ctx.globalAlpha=a;
    for(let k=0;k<3;k++){const j=Math.sin(t*.7+k*2)*12;const fg=ctx.createLinearGradient(0,m.y,0,GROUND);
      fg.addColorStop(0,'rgba(255,245,170,.85)');fg.addColorStop(.45,'rgba(255,150,20,.7)');fg.addColorStop(1,'rgba(225,35,0,.6)');
      ctx.fillStyle=fg;ctx.globalAlpha=a*.5;ctx.beginPath();ctx.moveTo(m.x-6,m.y);ctx.lineTo(m.x+6,m.y);ctx.lineTo(x1+j,GROUND);ctx.lineTo(x0-j,GROUND);ctx.closePath();ctx.fill();}
    ctx.globalAlpha=a;
    for(let x=x0;x<x1;x+=16){const fh=22+Math.sin(t*.5+x*.13)*12+Math.random()*6;ctx.fillStyle=(x/16|0)%2?'rgba(255,200,40,.85)':'rgba(255,110,10,.85)';
      ctx.beginPath();ctx.moveTo(x,GROUND);ctx.quadraticCurveTo(x+8,GROUND-fh*1.6,x+16,GROUND);ctx.fill();}
    ctx.restore();}
}
function drawPlayer(){
  const ducking=P.duck&&P.onGround, playing=state==='playing';
  const moving=mode==='run'?worldK>.15:Math.abs(P.vx)>.5;
  const bob=P.onGround&&playing&&moving?Math.abs(Math.sin(t*.35))*-4:0;
  let w=P.w,h=P.h; if(ducking){w=P.w*1.18;h=P.h*.62;} else if(!P.onGround){w=P.w*.94;h=P.h*1.06;}
  const x=P.x+(P.w-w)/2, y=P.y+(P.h-h)+bob;
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(P.x+P.w/2,GROUND-1,w*.38*(P.onGround?1:.7),5,0,0,7);ctx.fill();
  ctx.save();
  const tilt=state==='over'?.25:(P.onGround?(moving?Math.sin(t*.35)*.04:0):.1);
  ctx.translate(x+w/2,y+h); ctx.rotate(tilt*P.dir); ctx.scale(-P.dir,1);
  if(img.complete)ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col('top')); g.addColorStop(1,col('bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0;}
  if(mix>.02){ctx.fillStyle='#fff3fa';for(const s of stars){ctx.globalAlpha=mix*(.5+.5*Math.sin(t*.05+s.p));ctx.beginPath();ctx.arc(s.x%W,s.y,s.r,0,7);ctx.fill();}
    ctx.globalAlpha=mix;ctx.fillStyle='#fff3d6';ctx.beginPath();ctx.arc(W-150,60,20,0,7);ctx.fill();
    ctx.fillStyle=col('top');ctx.beginPath();ctx.arc(W-141,54,18,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(mix<.98){ctx.globalAlpha=1-mix;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(W-150,62,22,0,7);ctx.fill();ctx.globalAlpha=1;}
  clouds.forEach(drawCloud);
  drawBoss2();
  drawDragon();
  ctx.strokeStyle=col('ground');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,GROUND);ctx.lineTo(W+20,GROUND);ctx.stroke();
  ctx.fillStyle=col('soft');const off=groundOff;
  for(let i=0;i<Math.ceil(W/60)+2;i++)ctx.fillRect(i*60-off+((i*37)%23),GROUND+10+((i*13)%18),(i%3)+4,2);
  for(const o of obs){if(o.type==='broc')drawBroc(o);else if(o.type==='carrot')drawCarrot(o);else drawBug(o);}
  ctx.fillStyle=col('soft');for(const d of dust){ctx.globalAlpha=d.life/22;ctx.beginPath();ctx.arc(d.x,d.y,3,0,7);ctx.fill();}ctx.globalAlpha=1;
  if(state!=='menu'){drawBoss();for(const k of kisses)drawKiss(k);drawFallShadows();drawLasers();drawBreath();drawPlayer();drawFalls();}
  ctx.restore();
  if(state!=='menu'){
    ctx.textAlign='right';ctx.fillStyle=col('ink');ctx.font='22px Jua, sans-serif';
    ctx.fillText(String(Math.floor(score)).padStart(5,'0'),W-24,38);
    ctx.fillStyle=col('soft');ctx.font='16px Jua, sans-serif';ctx.fillText('최고 '+String(best).padStart(5,'0'),W-24,62);
    if(testRun||god)ctx.fillText(testRun?(god?'테스트 · 무적':'테스트'):'무적',W-24,84);
    {const bn=dg.active&&dg.phase!=='out'?'스카레드 슈퍼노바 드래곤':b2.active&&b2.phase!=='out'?'각성 고석영':(boss.active&&boss.phase!=='out'?'고석영':'');
     if(bn){ctx.textAlign='left';ctx.font='20px Jua, sans-serif';ctx.fillStyle=dg.active?'#ff6a1a':b2.active?'#ff3d6e':'#d0567f';ctx.fillText('BOSS · '+bn,22,36);ctx.textAlign='right';}}
    if(banner){ctx.globalAlpha=Math.min(1,banner.life/30);ctx.textAlign='center';ctx.font='38px Jua, sans-serif';
      {const bw=ctx.measureText(banner.text).width;if(bw>W-40)ctx.font=Math.floor(38*(W-40)/bw)+'px Jua, sans-serif';}
      ctx.lineWidth=6;ctx.strokeStyle=col('top');ctx.strokeText(banner.text,W/2,120);ctx.fillStyle='#ff5c8a';ctx.fillText(banner.text,W/2,120);ctx.globalAlpha=1;}
  }
  if(cs)drawCutscene();
}
let last=0,acc=0;
function loop(ts){ if(!last)last=ts; acc+=Math.min(100,ts-last); last=ts;
  while(acc>=1000/60){update();acc-=1000/60;} draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
if(nickEl.classList.contains('hidden'))$('startBtn').focus({preventScroll:true});
})();
