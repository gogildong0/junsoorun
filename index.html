<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이 준 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#fdeef3; --ink:#4a3241; --soft:#b58aa3; --accent:#8a6bc4; --accent-ink:#ffffff; --panel:rgba(253,238,243,.9);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
}
:root[data-theme="dark"]{--sky:#2a1e2b;--ink:#f6e3ee;--soft:#a07a92;--accent:#c4a8f0;--accent-ink:#2a1e2b;--panel:rgba(42,30,43,.9);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background-color .8s}
.wrap{position:relative;width:100%;max-width:900px}
canvas{display:block;width:100%;height:auto;border-radius:22px;cursor:pointer;outline:none;box-shadow:0 0 0 3px var(--soft)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.screen{position:absolute;inset:0;border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;
  gap:clamp(12px,4vw,40px);padding:12px 20px;box-sizing:border-box;text-align:center}
.screen.hidden{display:none}
.hero{width:clamp(52px,12vw,110px);height:auto;transform:scaleX(-1);animation:bob 1.1s ease-in-out infinite}
.over .hero{transform:scaleX(-1) rotate(14deg);animation:none;opacity:.9}
@keyframes bob{50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.col{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vw,10px)}
.title{font-size:clamp(26px,6.5vw,56px);line-height:1;cursor:default;-webkit-tap-highlight-color:transparent}
#overBig{font-size:clamp(20px,4.6vw,40px);line-height:1.15;max-width:16em}
.sub{font-size:clamp(13px,2.2vw,18px);color:var(--soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
button{font:inherit;font-size:clamp(14px,2.2vw,18px);border:0;border-radius:999px;padding:.45em 1.1em;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.btns.hidden{display:none}
.test button{font-size:clamp(12px,1.8vw,15px);padding:.35em .9em}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--soft)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:active{transform:translateY(1px)}
.help{font-size:15px;color:var(--soft);text-align:center;line-height:1.6;max-width:60ch}
kbd{font-family:inherit;border:2px solid var(--soft);border-radius:6px;padding:0 6px;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="900" height="300" tabindex="0" aria-label="게임 화면. 스페이스로 점프, 아래 화살표로 숙이기"></canvas>
  <div class="screen" id="menu">
    <img class="hero" id="heroMenu" alt="">
    <div class="col">
      <div class="title">이 준 수</div>
      <div class="sub" id="menuBest">최고 기록 0점</div>
      <div class="btns">
        <button id="startBtn">시작하기</button>
        <button class="ghost" id="soundBtn">소리 켜짐</button>
      </div>
      <div class="btns test hidden" id="testBtns">
        <button class="ghost" data-from="1000">고석영부터</button>
        <button class="ghost" data-from="1980">피하기 직전</button>
        <button class="ghost" data-from="2470">피하기 끝</button>
        <button class="ghost" data-from="3000">각성 고석영부터</button>
        <button class="ghost" id="godBtn">무적 꺼짐</button>
      </div>
    </div>
  </div>
  <div class="screen over hidden" id="over">
    <img class="hero" id="heroOver" alt="">
    <div class="col">
      <div class="title" id="overBig">또 졌다…</div>
      <div class="sub" id="overSmall">0점</div>
      <div class="btns">
        <button id="retryBtn">다시 하기</button>
        <button class="ghost" id="menuBtn">메뉴로</button>
      </div>
    </div>
  </div>
</div>
<div class="help"><kbd>스페이스</kbd> / <kbd>↑</kbd> 점프 · <kbd>↓</kbd> 숙이기 · <kbd>Esc</kbd> 메뉴<br>모바일: 탭하면 점프, 아래로 쓸면 숙이기<br>2000~2500점 얼굴 피하기 · 3000~4000점 각성 고석영: <kbd>←</kbd> <kbd>→</kbd> 이동 (모바일: 화면 왼쪽·오른쪽 누르기)</div>

/* ---------- palettes (lerped for smooth day/night) ---------- */
const PAL={
  light:{top:'#f7dbe8',bot:'#fdeef3',ground:'#6b4a5c',ink:'#4a3241',soft:'#b58aa3',cloud:'#ffffff'},
  dark: {top:'#3a2738',bot:'#2a1e2b',ground:'#e6bcd2',ink:'#f6e3ee',soft:'#a07a92',cloud:'#4a3549'}
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixC=(a,b,m)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*m)).join(',')+')';};
const sysDark=()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
let base=sysDark()?1:0, mix=base, target=base;
const col=k=>mixC(PAL.light[k],PAL.dark[k],mix);
function setPageTheme(v){ if(v===null)document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme=v?'dark':'light'; }

/* ---------- storage ---------- */
let best=0, soundOn=true;
try{best=+localStorage.getItem('pouty-best')||0; soundOn=localStorage.getItem('pouty-sound')!=='off';}catch(e){}
function syncMenu(){$('menuBest').textContent='최고 기록 '+best+'점'; $('soundBtn').textContent=soundOn?'소리 켜짐':'소리 꺼짐';}
syncMenu();

/* ---------- sound ---------- */
let ac=null;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); return ac; }
function tone(f1,f2,dur,type,vol,delay=0){
  if(!soundOn)return; const a=audio(); if(!a)return;

    b2.active=true;b2.phase='in';b2.rise=0;b2.cd=110;b2.charge=0;b2.beam=0;showBanner('각성 고석영 등장!');shake=12;playBgm('boss2');sfxBoss();}
  if(b2.active){
    if(b2.phase==='in'){b2.rise=Math.min(1,b2.rise+1/90);if(b2.rise>=1)b2.phase='fight';}
    else if(b2.phase==='fight'){
      if(b2.beam>0){if(--b2.beam===0)score+=15;}
      else if(b2.charge>0){if(--b2.charge===0){b2.beam=18;sfxLaser();shake=Math.max(shake,7);b2.cd=10+Math.random()*160;}}
      else if(--b2.cd<=0){b2.charge=48;const pc=P.x+P.w/2,cl=v=>Math.max(10,Math.min(W-10,v));
        b2.tgt=[cl(pc+(Math.random()-.5)*60), cl(Math.random()<.5?pc+(Math.random()-.5)*120:20+Math.random()*(W-40))];sfxCharge();}
      if(score>=4000){b2.phase='out';b2.charge=0;b2.beam=0;showBanner('각성 고석영을 물리쳤다!');noSpawnUntil=t+210;playBgm('game');mode='toRun';keyL=keyR=false;touchDir=0;}
    } else {b2.rise-=1/70;if(b2.rise<=0){b2.active=false;b2.done=true;nextSpawn=40;}}
  }
  for(const k of kisses)k.x+=3+speed*.15;
  kisses=kisses.filter(k=>k.x<W+40);
  if(mode==='run'&&!(boss.active&&boss.phase!=='out')&&!b2.active&&--nextSpawn<=0&&t>=noSpawnUntil)spawn();
  for(const o of obs)o.x-=speed*(o.type==='bug'?1.12:1);
  obs=obs.filter(o=>o.x>-80);
  const h=P.duck&&P.onGround?P.h*.62:P.h, top=P.onGround?GROUND-h:P.y;
  const box={x:P.x+13,y:top+10,w:P.w-26,h:h-15};
  for(const o of obs){if(hit(box,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-6})){die(o.type);break;}}
  if(state==='playing'&&b2.beam>2){const eyes=b2Eyes();let hitL=false;
    for(let i=0;i<2&&!hitL;i++){const e=eyes[i],tx=b2.tgt[i];
      for(let j=0;j<=40;j++){const q=j/40,px=e.x+(tx-e.x)*q,py=e.y+(GROUND-e.y)*q;
        if(px>box.x-4&&px<box.x+box.w+4&&py>box.y-4&&py<box.y+box.h+4){hitL=true;break;}}}
    if(hitL)die('laser');}
  if(state==='playing')for(const k of kisses){if(hit(box,{x:k.x+3,y:k.y+3,w:k.w-6,h:k.h-6})){die('kiss');break;}}
  if(state==='playing')for(const f of falls){if(hit(box,{x:f.x+f.w*.18,y:f.y+f.h*.15,w:f.w*.64,h:f.h*.75})){die('face');break;}}
}
const LINES={
  any:['또 졌다…','아 진짜 안 해','이건 랙이야','방금 건 무효지?','하… 한 판만 더','손이 미끄러졌어','기분 나빠졌어','오늘은 운이 없네','억울하다…','진짜 마지막 판이야','다리가 짧아서 그래','흥, 일부러 져준 거야'],
  broc:['브로콜리는 진짜 싫어','초록색 나무한테 졌다','브로콜리 때문에 기분 망침','채소는 역시 적이야'],
  carrot:['당근은 반칙이야','당근한테 졌다니 당근히 분하다','당근 맛없어…','눈이 좋아질 뻔했네'],
  bug:['모기 진짜 짜증나','어디서 윙윙거려…','모기한테 물렸다','벌레는 반칙이지'],
  laser:['눈에서 레이저는 반칙이지','눈빛만으로 당했다','레이저 맞고 바삭해짐','그 눈빛 무서워…','째려보지 마…'],
  kiss:['뽀뽀는 피했어야 했는데','으악 맞아버렸다','고석영 뽀뽀에 쓰러짐…','그 입술은 반칙이야','다시는 안 당해'],
  face:['이거 장난이지?','아뇨아뇨','브롤스타즈 들어와'],
  best:['신기록… 근데 기분은 별로','신기록인데 왜 안 기쁘지','최고 기록 갱신… 흥','기록은 깨졌는데 내 마음도 깨졌어']
};
let lastLine='';
function pickLine(cause,isBest){
  if(cause==='face'){lastLine=LINES.face[Math.floor(Math.random()*LINES.face.length)];return lastLine;}
  let pool=isBest?LINES.best:(LINES[cause]&&Math.random()<(cause==='kiss'||cause==='laser'?.75:.5)?LINES[cause]:LINES.any);
  pool=pool.filter(l=>l!==lastLine)||pool; lastLine=pool[Math.floor(Math.random()*pool.length)]; return lastLine;
}
function die(cause){if(god){shake=Math.max(shake,5);return;}
  state='over'; shake=14; overAt=performance.now(); stopBgm(); sfxDie();
  const s=Math.floor(score), isBest=!testRun&&s>best;
  if(isBest){best=s;try{localStorage.setItem('pouty-best',best);}catch(e){}}
  $('overBig').textContent=pickLine(cause,isBest);
  $('overSmall').textContent=s+'점 · 최고 '+best+'점';
  setTimeout(()=>{if(state==='over'){playBgm('over');over.classList.remove('hidden');$('retryBtn').focus({preventScroll:true});}},550);
}

/* ---------- drawing ---------- */
function drawCloud(c){ctx.fillStyle=col('cloud');ctx.globalAlpha=.85;ctx.beginPath();const s=c.s;
  ctx.arc(c.x,c.y,18*s,0,7);ctx.arc(c.x+22*s,c.y-10*s,22*s,0,7);ctx.arc(c.x+48*s,c.y,17*s,0,7);ctx.rect(c.x,c.y,48*s,16*s);ctx.fill();ctx.globalAlpha=1;}
function drawBroc(o){for(let i=0;i<o.n;i++){const x=o.x+3+i*34;
  ctx.fillStyle='#8fbf5a';ctx.fillRect(x+12,o.y+22,10,24);
  ctx.fillStyle='#4f9a3a';ctx.beginPath();ctx.arc(x+8,o.y+18,10,0,7);ctx.arc(x+26,o.y+18,10,0,7);ctx.arc(x+17,o.y+9,11,0,7);ctx.fill();
  ctx.fillStyle='#3b7a2c';ctx.beginPath();ctx.arc(x+12,o.y+12,3,0,7);ctx.arc(x+23,o.y+20,3,0,7);ctx.fill();}}
function drawCarrot(o){
  ctx.fillStyle='#5aa83f';ctx.beginPath();ctx.ellipse(o.x+10,o.y+8,4,11,-.4,0,7);ctx.ellipse(o.x+20,o.y+8,4,11,.4,0,7);ctx.ellipse(o.x+15,o.y+5,4,12,0,0,7);ctx.fill();
  ctx.fillStyle='#f08a3c';ctx.beginPath();ctx.moveTo(o.x+2,o.y+18);ctx.quadraticCurveTo(o.x+15,o.y+12,o.x+28,o.y+18);ctx.lineTo(o.x+15,o.y+o.h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c8682a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x+8,o.y+30);ctx.lineTo(o.x+14,o.y+30);ctx.moveTo(o.x+16,o.y+42);ctx.lineTo(o.x+21,o.y+42);ctx.stroke();}
function drawBug(o){const f=Math.sin(t*.9)*6;
  ctx.fillStyle='rgba(200,220,255,.75)';ctx.beginPath();ctx.ellipse(o.x+20,o.y+6-f*.3,10,6+f*.4,-.5,0,7);ctx.ellipse(o.x+30,o.y+6-f*.3,10,6+f*.4,.5,0,7);ctx.fill();
  ctx.fillStyle=mix>.5?'#cdb8c6':'#5b4a52';ctx.beginPath();ctx.ellipse(o.x+24,o.y+16,14,7,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(o.x+8,o.y+14,6,0,7);ctx.fill();
  ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x+3,o.y+15);ctx.lineTo(o.x-8,o.y+19);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x+6,o.y+12,2,0,7);ctx.fill();}
function bossW(){return bossImg.width?150*bossImg.width/bossImg.height:115;}
function heart(x,y,s,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ff5c8a';ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
  ctx.moveTo(0,-4);ctx.bezierCurveTo(0,-10,-10,-12,-10,-4);ctx.bezierCurveTo(-10,2,-2,6,0,10);ctx.bezierCurveTo(2,6,10,2,10,-4);ctx.bezierCurveTo(10,-12,0,-10,0,-4);ctx.fill();ctx.restore();}
function drawKiss(k){
  ctx.strokeStyle=col('soft');ctx.lineWidth=2;ctx.globalAlpha=.6;ctx.beginPath();
  for(let i=0;i<3;i++){const ly=k.y+8+i*8,lx=k.x-8-((t*3+i*9)%14);ctx.moveTo(lx,ly);ctx.lineTo(lx-14-i*4,ly);}
  ctx.stroke();ctx.globalAlpha=1;
  if(busImg.complete)ctx.drawImage(busImg,k.x,k.y+Math.sin(t*.6)*1.2,k.w,k.h);}
function drawBoss(){
  if(!boss.active)return;
  const bh=150,bw=bossW(),hov=Math.sin(t*.08)*6;
  const sc=boss.charge>0?1.03+Math.sin(boss.charge*.7)*.03:1;
  const cx=boss.x+bw/2,by=GROUND-10+hov;
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(cx,GROUND-1,bw*.4,6,0,0,7);ctx.fill();
  ctx.save();ctx.translate(cx,by);ctx.scale(sc,sc);ctx.rotate(Math.sin(t*.05)*.05);
  if(bossImg.complete)ctx.drawImage(bossImg,-bw/2,-bh,bw,bh);
  ctx.restore();
  if(boss.charge>0){const p=(42-boss.charge)/42;
    {const gs=.4+p*.6,gw=68*gs,gh=32*gs,gx=boss.x+bw-gw*.55,gy=(boss.kissHigh?GROUND-62:GROUND-18)-gh/2;
     ctx.globalAlpha=.25+p*.55;if(busImg.complete)ctx.drawImage(busImg,gx,gy,gw,gh);ctx.globalAlpha=1;}
    ctx.fillStyle='#ff5c8a';ctx.font='34px Jua, sans-serif';ctx.textAlign='center';ctx.fillText('!',cx+bw*.3,by-bh-4+Math.sin(t*.5)*3);}
}
function drawFallShadows(){for(const f of falls){const p=Math.max(0,Math.min(1,(f.y+f.h)/GROUND));
  ctx.fillStyle='rgba(0,0,0,'+(.06+p*.16)+')';ctx.beginPath();ctx.ellipse(f.x+f.w/2,GROUND-1,f.w*(.15+p*.35),3+p*3,0,0,7);ctx.fill();}}
function drawFalls(){for(const f of falls){ctx.save();ctx.translate(f.x+f.w/2,f.y+f.h/2);ctx.rotate(f.rot);
  if(fallImg.complete)ctx.drawImage(fallImg,-f.w/2,-f.h/2,f.w,f.h);ctx.restore();}}
function b2Geom(){const bh=230,bw=bh*(boss2Img.width?boss2Img.width/boss2Img.height:1.11);
  const e=b2.rise<1?1-Math.pow(1-b2.rise,3):1;const hov=b2.phase==='fight'?Math.sin(t*.04)*4:0;
  const x=W/2-bw/2,y=GROUND-bh+(1-e)*(bh+10)+hov;return {x,y,bw,bh};}
function b2Eyes(){const g=b2Geom();return [{x:g.x+g.bw*.347,y:g.y+g.bh*.304},{x:g.x+g.bw*.573,y:g.y+g.bh*.289}];}
function drawBoss2(){
  if(!b2.active)return;const g=b2Geom();
  ctx.save();ctx.beginPath();ctx.rect(-20,-20,W+40,GROUND+20);ctx.clip();
  ctx.globalAlpha=.93;if(boss2Img.complete)ctx.drawImage(boss2Img,g.x,g.y,g.bw,g.bh);ctx.globalAlpha=1;
  if(b2.charge>0||b2.beam>0){const p=b2.beam>0?1:(48-b2.charge)/48;
    for(const e of b2Eyes()){const r=4+p*9+(b2.beam>0?Math.random()*3:0);
      const gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r*2.2);gr.addColorStop(0,'rgba(255,255,255,'+(.6+p*.4)+')');gr.addColorStop(.35,'rgba(255,60,90,'+(.5+p*.5)+')');gr.addColorStop(1,'rgba(255,60,90,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(e.x,e.y,r*2.2,0,7);ctx.fill();}}
  ctx.restore();
  if(b2.charge>0){ctx.fillStyle='#ff3d6e';ctx.font='34px Jua, sans-serif';ctx.textAlign='center';ctx.fillText('!',W/2,Math.max(30,g.y-6)+Math.sin(t*.5)*3);}
}
function laserEnd(i){return {x:b2.tgt[i],y:GROUND};}
function drawLasers(){
  if(!b2.active||!(b2.charge>0||b2.beam>0))return;
  const eyes=b2Eyes();
  for(let i=0;i<2;i++){const e=eyes[i],end=laserEnd(i);
    if(b2.beam>0){const a=Math.min(1,b2.beam/8);
      ctx.save();ctx.globalAlpha=a;const gr=ctx.createRadialGradient(end.x,end.y,0,end.x,end.y,26);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.4,'rgba(255,60,90,.7)');gr.addColorStop(1,'rgba(255,60,90,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(end.x,end.y,26+Math.random()*4,0,7);ctx.fill();ctx.restore();
      if(t%3===0)dust.push({x:end.x,y:GROUND-3,vx:(Math.random()-.5)*5,vy:-Math.random()*3,life:16});
      ctx.save();ctx.globalAlpha=a;ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,50,90,.35)';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(end.x,end.y);ctx.stroke();
      ctx.strokeStyle='#ff3d6e';ctx.lineWidth=8;ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();}
    else{const p=(48-b2.charge)/48;
      if(Math.floor(t/4)%2||p>.7){ctx.save();ctx.setLineDash([8,6]);ctx.lineDashOffset=-t*2;ctx.globalAlpha=.25+p*.5;
        ctx.strokeStyle='#ff3d6e';ctx.lineWidth=1.5+p*1.5;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(end.x,end.y);ctx.stroke();ctx.restore();}
      ctx.save();ctx.globalAlpha=.3+p*.6;ctx.strokeStyle='#ff3d6e';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(end.x,GROUND-1,10+p*12,3+p*2,0,0,7);ctx.stroke();ctx.restore();}
  }
}
function drawPlayer(){
  const ducking=P.duck&&P.onGround, playing=state==='playing';
  const moving=mode==='run'?worldK>.15:Math.abs(P.vx)>.5;
  const bob=P.onGround&&playing&&moving?Math.abs(Math.sin(t*.35))*-4:0;
  let w=P.w,h=P.h; if(ducking){w=P.w*1.18;h=P.h*.62;} else if(!P.onGround){w=P.w*.94;h=P.h*1.06;}
  const x=P.x+(P.w-w)/2, y=P.y+(P.h-h)+bob;
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(P.x+P.w/2,GROUND-1,w*.38*(P.onGround?1:.7),5,0,0,7);ctx.fill();
  ctx.save();
  const tilt=state==='over'?.25:(P.onGround?(moving?Math.sin(t*.35)*.04:0):.1);
  ctx.translate(x+w/2,y+h); ctx.rotate(tilt*P.dir); ctx.scale(-P.dir,1);
  if(img.complete)ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col('top')); g.addColorStop(1,col('bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0;}
  if(mix>.02){ctx.fillStyle='#fff3fa';for(const s of stars){ctx.globalAlpha=mix*(.5+.5*Math.sin(t*.05+s.p));ctx.beginPath();ctx.arc(s.x%W,s.y,s.r,0,7);ctx.fill();}
    ctx.globalAlpha=mix;ctx.fillStyle='#fff3d6';ctx.beginPath();ctx.arc(W-150,60,20,0,7);ctx.fill();
    ctx.fillStyle=col('top');ctx.beginPath();ctx.arc(W-141,54,18,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(mix<.98){ctx.globalAlpha=1-mix;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(W-150,62,22,0,7);ctx.fill();ctx.globalAlpha=1;}
  clouds.forEach(drawCloud);
  drawBoss2();
  ctx.strokeStyle=col('ground');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,GROUND);ctx.lineTo(W+20,GROUND);ctx.stroke();
  ctx.fillStyle=col('soft');const off=groundOff;
  for(let i=0;i<Math.ceil(W/60)+2;i++)ctx.fillRect(i*60-off+((i*37)%23),GROUND+10+((i*13)%18),(i%3)+4,2);
  for(const o of obs){if(o.type==='broc')drawBroc(o);else if(o.type==='carrot')drawCarrot(o);else drawBug(o);}
  ctx.fillStyle=col('soft');for(const d of dust){ctx.globalAlpha=d.life/22;ctx.beginPath();ctx.arc(d.x,d.y,3,0,7);ctx.fill();}ctx.globalAlpha=1;
  if(state!=='menu'){drawBoss();for(const k of kisses)drawKiss(k);drawFallShadows();drawLasers();drawPlayer();drawFalls();}
  ctx.restore();
  if(state!=='menu'){
    ctx.textAlign='right';ctx.fillStyle=col('ink');ctx.font='22px Jua, sans-serif';
    ctx.fillText(String(Math.floor(score)).padStart(5,'0'),W-24,38);
    ctx.fillStyle=col('soft');ctx.font='16px Jua, sans-serif';ctx.fillText('최고 '+String(best).padStart(5,'0'),W-24,62);
    if(testRun||god)ctx.fillText(testRun?(god?'테스트 · 무적':'테스트'):'무적',W-24,84);
    {const bn=b2.active&&b2.phase!=='out'?'각성 고석영':(boss.active&&boss.phase!=='out'?'고석영':'');
     if(bn){ctx.textAlign='left';ctx.font='20px Jua, sans-serif';ctx.fillStyle=b2.active?'#ff3d6e':'#d0567f';ctx.fillText('BOSS · '+bn,22,36);ctx.textAlign='right';}}
    if(banner){ctx.globalAlpha=Math.min(1,banner.life/30);ctx.textAlign='center';ctx.font='38px Jua, sans-serif';
      ctx.lineWidth=6;ctx.strokeStyle=col('top');ctx.strokeText(banner.text,W/2,120);ctx.fillStyle='#ff5c8a';ctx.fillText(banner.text,W/2,120);ctx.globalAlpha=1;}
  }
}
let last=0,acc=0;
function loop(ts){ if(!last)last=ts; acc+=Math.min(100,ts-last); last=ts;
  while(acc>=1000/60){update();acc-=1000/60;} draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
$('startBtn').focus({preventScroll:true});
})();
